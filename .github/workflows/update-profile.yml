name: Update Terminal Profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate profile
        env:
          ACCESS_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USER_NAME: keshmaSalgado
        run: python generate_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile_dark.svg assets/profile_light.svg
          git diff --cached --quiet || git commit -m "Update profile statistics"
          git push
